name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tomcat 9 and 10.1 on the JDK most projects use.
          - java: "17"
            tomcat: ""
          # The oldest JDK the provider supports runs Tomcat 9, Maven and Gradle 8.
          - java: "8"
            tomcat: "9.0.124"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 17 compiles the provider (javac --release 8); the last version listed is the default.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Download the pinned Tomcat versions
        run: node scripts/test/fetch-tomcat.mjs
      - name: Check the manifest and build the archives
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
          PATH_PREFIX: ${{ env.JAVA_HOME_17_X64 }}/bin
        run: PATH="$PATH_PREFIX:$PATH" node scripts/package.mjs
      - name: Run Web modules on real Tomcat
        run: |
          if [[ -n "${{ matrix.tomcat }}" ]]; then
            export LITHE_TEST_TOMCAT_HOMES="$PWD/.artifacts/tomcat/apache-tomcat-${{ matrix.tomcat }}"
          fi
          java -version
          node scripts/test.mjs
      - name: Hand the Windows archive to the Windows job
        if: matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: tomcat-windows
          path: dist/tomcat-*-windows.zip
          if-no-files-found: error
      - name: Validate against Lithe Store rules
        if: matrix.java == '17'
        run: |
          git clone --depth 1 https://github.com/Lithe-IDEA/Lithe-store "$RUNNER_TEMP/store"
          node --input-type=module -e "
            import { readPackageManifests, checkManifest } from '$RUNNER_TEMP/store/scripts/validate-index.mjs';
            import { readdirSync, readFileSync } from 'node:fs';
            const manifest = JSON.parse(readFileSync('io.github.lithe-idea.tomcat/plugin.json', 'utf8'));
            const entry = { id: manifest.id };
            let failed = false;
            for (const name of readdirSync('dist').filter((name) => name.endsWith('.zip'))) {
              const { manifests, unsafe } = readPackageManifests('dist/' + name, entry.id);
              const problems = [...unsafe, ...checkManifest(manifests, entry, manifest)];
              for (const problem of problems) { console.error(name + ': ' + problem); failed = true; }
            }
            process.exit(failed ? 1 : 0);
          "
      - name: Upload timing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timings-linux-java-${{ matrix.java }}
          path: .artifacts/test-stability/
          if-no-files-found: warn

  # The Windows archive built above runs every Web module through mvn.cmd and
  # gradle.bat, on the same Tomcat versions.
  windows:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - uses: actions/download-artifact@v4
        with:
          name: tomcat-windows
          path: ${{ runner.temp }}/archive
      - name: Unpack the Windows archive
        run: |
          $archive = Get-ChildItem "$env:RUNNER_TEMP\archive\tomcat-*-windows.zip" | Select-Object -First 1
          Expand-Archive -Path $archive.FullName -DestinationPath "dist\package"
      - name: Download the pinned Tomcat versions
        run: node scripts/test/fetch-tomcat.mjs
      - name: Run Web modules on real Tomcat
        run: node scripts/test.mjs
      - name: Upload timing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timings-windows
          path: .artifacts/test-stability/
          if-no-files-found: warn
